server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    location /api/users { proxy_pass http://user-service:8001/users; proxy_set_header Host $proxy_host; }
    location /api/products { proxy_pass http://product-service:8002/products; proxy_set_header Host $proxy_host; }
    location /api/orders { proxy_pass http://order-service:8003/orders; proxy_set_header Host $proxy_host; }
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
